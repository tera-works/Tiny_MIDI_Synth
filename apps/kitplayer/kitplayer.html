<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kitplayer</title>
<!--
  kitplayer（GUI 版）— midikit で最適化した MIDI ファイルを midi_keyboard_kit_synth に流し続ける展示用プレーヤー
  使い方: Chrome または Edge でこのファイルを開き、「フォルダを選ぶ」で「最適化後」フォルダを選んで再生。
          （Mac の Safari は Web MIDI に対応していないので Chrome を使う）
  ・フォルダの playlist.txt の順番で繰り返し再生（無ければ名前順）。「# ---- 名前 ----」の行で枠の名前を付けられる
  ・出力先は名前に「TinyKeyboard」を含む MIDI 出力（無ければ PC のソフト音源以外の出力が 1 つならそれ）
  ・各曲の前に GM リセット。曲の途中の SysEx（midikit の音質モードの切り替え）もそのまま送る
  ・本体が抜けたら待ち、挿し直されたら自動でつなぎ直して、その曲を頭から再生する
  ・チャンネルごとに、本体で鳴る音色・GM の音色・音量・ベンド・押さえている鍵盤を表示する
  キー: スペース = 一時停止 / 再開、n または → = 次、b または ← = 前、r = 頭から、s = 停止、f = 全画面
  動作確認用: ?dry=1（MIDI を送らない）、?load=フォルダ（http で開いたとき、そのフォルダの playlist.txt を読む）
-->
<style>
:root {
  --bg: #0f1115; --panel: #171a21; --panel2: #1e222b; --line: #2a2f3a; --text: #e8eaf0; --sub: #9aa3b5;
  --accent: #5fb3ff; --good: #46c27a; --warn: #f0b04a; --bad: #ef5a5a; --white-key: #e9ecf2; --black-key: #262a33;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f4f5f8; --panel: #ffffff; --panel2: #eef0f4; --line: #d9dde5; --text: #1b1e25; --sub: #5c6577;
    --accent: #1f7fd6; --white-key: #ffffff; --black-key: #2b2f38;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif; }
button, select, input { font: inherit; color: inherit; }
button { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
.brand { font-weight: 700; font-size: 16px; }
.brand span { font-weight: 400; color: var(--sub); font-size: 12px; margin-left: 6px; }
.pills { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
.pill { padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel2); font-size: 12px; white-space: nowrap; }
.pill.ok { border-color: var(--good); color: var(--good); }
.pill.ng { border-color: var(--bad); color: var(--bad); }
.pill.hq { border-color: var(--accent); color: var(--accent); }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; height: calc(100% - 53px); }
main { overflow: auto; padding: 16px; min-width: 0; }
aside { border-left: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 12px 14px; }
.now { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; }
.section { color: var(--accent); font-size: 13px; font-weight: 600; min-height: 1.5em; }
.title { font-size: 28px; font-weight: 700; line-height: 1.25; margin: 2px 0 10px; overflow-wrap: anywhere; }
.seekrow { display: flex; align-items: center; gap: 10px; font-variant-numeric: tabular-nums; color: var(--sub); }
.seekrow input { flex: 1; accent-color: var(--accent); }
.controls { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.controls button { min-width: 44px; font-size: 15px; }
.controls .play { background: var(--accent); color: #fff; border-color: var(--accent); min-width: 120px; font-weight: 600; }
.banner { margin-top: 10px; padding: 8px 12px; border-radius: 8px; background: color-mix(in srgb, var(--bad) 18%, transparent); border: 1px solid var(--bad); }
.chans { display: flex; flex-direction: column; gap: 6px; }
.chan { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 10px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; }
.chan .info { min-width: 0; }
.chan .head { display: flex; align-items: center; gap: 6px; }
.chan .no { font-size: 11px; color: var(--sub); width: 34px; flex: none; }
.chan .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.chan .inst { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chan .gm { font-size: 11px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 40px; }
.chan .meters { display: flex; align-items: center; gap: 6px; padding-left: 40px; font-size: 11px; color: var(--sub); }
.chan .vol { flex: 1; height: 4px; background: var(--panel2); border-radius: 2px; overflow: hidden; }
.chan .vol i { display: block; height: 100%; background: var(--sub); }
.chan .bend { width: 64px; text-align: right; font-variant-numeric: tabular-nums; }
.chan canvas { width: 100%; height: var(--keyh, 40px); display: block; }
.chans.compact .chan { padding: 2px 10px; }
.chans.compact .chan .gm, .chans.compact .chan .meters { display: none; }
.empty { color: var(--sub); padding: 24px; text-align: center; border: 1px dashed var(--line); border-radius: 12px; }
h2 { font-size: 13px; color: var(--sub); margin: 14px 0 6px; font-weight: 600; }
h2:first-child { margin-top: 0; }
.plist { list-style: none; margin: 0; padding: 0; }
.plist .sec { font-size: 11px; color: var(--accent); margin: 8px 0 2px; }
.plist .song { display: flex; justify-content: space-between; gap: 8px; padding: 4px 8px; border-radius: 6px; cursor: pointer; }
.plist .song:hover { background: var(--panel2); }
.plist .song.cur { background: color-mix(in srgb, var(--accent) 22%, transparent); font-weight: 600; }
.plist .song .d { color: var(--sub); font-variant-numeric: tabular-nums; }
.plist .total { font-size: 12px; color: var(--sub); margin-top: 6px; }
.settings label { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 6px 0; }
.settings select { max-width: 180px; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }
.settings input[type=number] { width: 70px; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }
.log { font-size: 12px; color: var(--sub); max-height: 220px; overflow: auto; white-space: pre-wrap; font-variant-numeric: tabular-nums; }
.keys { font-size: 11px; color: var(--sub); margin-top: 10px; }
kbd { border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; font: inherit; }
@media (max-width: 820px) {
  .layout { grid-template-columns: 1fr; height: auto; }
  aside { border-left: 0; border-top: 1px solid var(--line); }
  .chan { grid-template-columns: 1fr; }
  .chan .gm, .chan .meters { padding-left: 40px; }
  .title { font-size: 22px; }
}
</style>
</head>
<body>
<header>
  <div class="brand">kitplayer<span>midi_keyboard_kit_synth 展示用プレーヤー</span></div>
  <div class="pills">
    <span id="devPill" class="pill">本体: 未接続</span>
    <span id="qPill" class="pill">音質: —</span>
  </div>
  <button id="btnFolder">フォルダを選ぶ</button>
  <input type="file" id="dirInput" webkitdirectory multiple hidden>
  <button id="btnFull">全画面</button>
</header>
<div class="layout">
  <main>
    <section class="now">
      <div id="section" class="section"></div>
      <div id="title" class="title">「フォルダを選ぶ」で「最適化後」フォルダを選んでください</div>
      <div class="seekrow"><span id="tCur">0:00</span><input type="range" id="seek" min="0" max="1" step="0.1" value="0" disabled><span id="tDur">0:00</span></div>
      <div class="controls">
        <button id="btnPrev" title="前の曲（b / ←）">⏮</button>
        <button id="btnPlay" class="play" title="再生 / 一時停止（スペース）">▶ 再生</button>
        <button id="btnNext" title="次の曲（n / →）">⏭</button>
        <button id="btnRestart" title="頭から（r）">↺ 頭から</button>
        <button id="btnStop" title="停止（s）">■ 停止</button>
      </div>
      <div id="banner" class="banner" hidden></div>
    </section>
    <section id="chans" class="chans"><div class="empty">曲を再生すると、チャンネルごとの音色と押さえている鍵盤がここに出ます</div></section>
  </main>
  <aside>
    <h2>プレイリスト</h2>
    <ul id="plist" class="plist"></ul>
    <div id="total" class="total"></div>
    <h2>設定</h2>
    <div class="settings">
      <label>出力先 <select id="selPort"></select></label>
      <label>曲間（秒） <input type="number" id="gap" min="0" max="30" step="0.5" value="2"></label>
      <label>最後まで行ったら繰り返す <input type="checkbox" id="repeat" checked></label>
      <label>MIDI を送らない（確認用） <input type="checkbox" id="dry"></label>
    </div>
    <div class="keys"><kbd>Space</kbd> 一時停止/再開　<kbd>n</kbd><kbd>→</kbd> 次　<kbd>b</kbd><kbd>←</kbd> 前　<kbd>r</kbd> 頭から　<kbd>s</kbd> 停止　<kbd>f</kbd> 全画面</div>
    <h2>ログ</h2>
    <div id="log" class="log"></div>
  </aside>
</div>
<script>
"use strict";
// ---------------- 本体の音源の対応表（MultiSynth.h の GM_MAP / INSTRUMENTS） ----------------
const INST = ["Saw Lead","Acid Bass","Soft Pad","Pluck Echo","Fuzz Lead","Buzzer Square","E.Piano","Organ","Strings","Brass","Flute","Clean Guitar","Drive Guitar","Finger Bass","Synth Bass","Marimba","Bell","Harp","Drum Kit","Sax","Piano","Bright Piano","Honky-tonk","Harpsichord","Clavinet","Celesta","Glockenspiel","Vibraphone","Xylophone","Tubular Bells","Perc Organ","Rock Organ","Church Organ","Accordion","Harmonica","Nylon Guitar","Steel Guitar","Jazz Guitar","Muted Guitar","Overdrive Gtr","Gtr Harmonics","Acoustic Bass","Pick Bass","Fretless Bass","Slap Bass","Violin","Cello","Pizzicato","Timpani","Slow Strings","Synth Strings","Choir Aahs","Voice Lead","Orchestra Hit","Trumpet","Trombone","Tuba","Muted Trumpet","French Horn","Synth Brass","Oboe","Bassoon","Clarinet","Square Lead","Fifths Lead","Warm Pad","Poly Synth","Sweep Pad","Sitar","Banjo","Shamisen","Bagpipe","Steel Drum","Woodblock","Taiko","Melodic Tom","Synth Drum","Reverse Cymbal","Noise FX","Noise Hit","Agogo","Recorder"];
const GM_MAP = [20,21,21,22,6,6,23,24, 25,26,25,27,15,28,29,36, 7,30,31,32,33,33,34,33, 35,36,37,11,38,39,12,40, 41,13,42,43,44,44,1,14, 45,45,46,46,8,47,17,48, 8,49,50,50,51,52,52,53, 54,55,56,57,58,9,59,59, 19,19,19,19,60,60,61,62, 10,10,81,10,10,10,81,81, 63,0,81,10,4,52,64,0, 2,65,66,51,65,67,51,67, 78,65,16,3,66,67,3,67, 68,69,70,17,15,71,45,60, 26,80,72,73,74,75,76,77, 79,78,78,81,63,78,78,79];
const GM_NAMES = ["Acoustic Grand Piano","Bright Acoustic Piano","Electric Grand Piano","Honky-tonk Piano","Electric Piano 1","Electric Piano 2","Harpsichord","Clavinet","Celesta","Glockenspiel","Music Box","Vibraphone","Marimba","Xylophone","Tubular Bells","Dulcimer","Drawbar Organ","Percussive Organ","Rock Organ","Church Organ","Reed Organ","Accordion","Harmonica","Tango Accordion","Nylon Guitar","Steel Guitar","Jazz Guitar","Clean Guitar","Muted Guitar","Overdriven Guitar","Distortion Guitar","Guitar Harmonics","Acoustic Bass","Finger Bass","Pick Bass","Fretless Bass","Slap Bass 1","Slap Bass 2","Synth Bass 1","Synth Bass 2","Violin","Viola","Cello","Contrabass","Tremolo Strings","Pizzicato Strings","Orchestral Harp","Timpani","String Ensemble 1","String Ensemble 2","Synth Strings 1","Synth Strings 2","Choir Aahs","Voice Oohs","Synth Voice","Orchestra Hit","Trumpet","Trombone","Tuba","Muted Trumpet","French Horn","Brass Section","Synth Brass 1","Synth Brass 2","Soprano Sax","Alto Sax","Tenor Sax","Baritone Sax","Oboe","English Horn","Bassoon","Clarinet","Piccolo","Flute","Recorder","Pan Flute","Blown Bottle","Shakuhachi","Whistle","Ocarina","Square Lead","Saw Lead","Calliope Lead","Chiff Lead","Charang Lead","Voice Lead","Fifths Lead","Bass + Lead","New Age Pad","Warm Pad","Polysynth Pad","Choir Pad","Bowed Pad","Metallic Pad","Halo Pad","Sweep Pad","Rain FX","Soundtrack FX","Crystal FX","Atmosphere FX","Brightness FX","Goblins FX","Echoes FX","Sci-fi FX","Sitar","Banjo","Shamisen","Koto","Kalimba","Bagpipe","Fiddle","Shanai","Tinkle Bell","Agogo","Steel Drums","Woodblock","Taiko Drum","Melodic Tom","Synth Drum","Reverse Cymbal","Guitar Fret Noise","Breath Noise","Seashore","Bird Tweet","Telephone Ring","Helicopter","Applause","Gunshot"];
const DEFAULT_PORT = "TinyKeyboard";
const SOFT_PORTS = ["Microsoft GS Wavetable", "IAC", "Network", "loopMIDI", "Session"];
const CH_COLORS = ["#ff6b6b","#ffa94d","#ffd43b","#a9e34b","#51cf66","#20c997","#22b8cf","#4dabf7","#748ffc","#9775fa","#e599f7","#f783ac","#ff8787","#ffc078","#8ce99a","#66d9e8"];
const LOOKAHEAD = 0.35;          // 何秒先まで時刻指定で送っておくか（裏に回ってタイマーが遅れても途切れない）

// ---------------- 状態 ----------------
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
let songs = [];                  // { name, rel, file|url, section, dur }
let cur = -1;                    // 再生中の曲の番号
let song = null;                 // { ev:[{t,d}], dur, chans:[...] }
let state = "idle";              // idle / playing / paused / stopped / gap / waiting
let songStart = 0;               // 曲の 0 秒の performance.now()（ms）
let pausePos = 0;                // 一時停止した位置（秒）
let sendIdx = 0;                 // 次に送るイベント
let visIdx = 0;                  // 次に表示へ反映するイベント
let gapUntil = 0;
let access = null, out = null, sysexOK = false;
let wakeLock = null;
let seeking = false;
const settings = (() => { try { return JSON.parse(localStorage.getItem("kitplayer") || "{}"); } catch { return {}; } })();
const saveSettings = () => { try { localStorage.setItem("kitplayer", JSON.stringify(settings)); } catch {} };

// ---------------- ログ ----------------
function log(msg) {
  const d = new Date(), p = n => String(n).padStart(2, "0");
  const line = `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}  ${msg}`;
  const el = $("log"); el.textContent = line + "\n" + el.textContent.split("\n").slice(0, 200).join("\n");
}
const fmt = s => { s = Math.max(0, Math.floor(s)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };

// ---------------- 標準 MIDI ファイル ----------------
function parseSMF(buf) {
  const b = new Uint8Array(buf), dv = new DataView(buf);
  const tag = p => String.fromCharCode(b[p], b[p + 1], b[p + 2], b[p + 3]);
  if (b.length < 14 || tag(0) !== "MThd") throw new Error("MIDI ファイルではありません");
  const hl = dv.getUint32(4), ntrk = dv.getUint16(10), div = dv.getUint16(12);
  if (div & 0x8000) throw new Error("SMPTE 形式には未対応");
  const raw = [], tempos = [];
  let pos = 8 + hl;
  for (let tr = 0; tr < ntrk && pos + 8 <= b.length;) {
    const len = dv.getUint32(pos + 4);
    if (tag(pos) !== "MTrk") { pos += 8 + len; continue; }
    let i = pos + 8, t = 0, rs = 0, ord = 0;
    const end = Math.min(b.length, pos + 8 + len);
    const rv = () => { let v = 0; while (i < end) { const c = b[i++]; v = (v << 7) | (c & 127); if (!(c & 128)) break; } return v; };
    while (i < end) {
      t += rv(); if (i >= end) break;
      const c = b[i];
      if (c === 0xFF) {
        const m = b[i + 1]; i += 2; const l = rv();
        if (m === 0x51 && l === 3) tempos.push([t, (b[i] << 16) | (b[i + 1] << 8) | b[i + 2]]);
        i += l; continue;
      }
      if (c === 0xF0 || c === 0xF7) {
        i++; const l = rv(); if (i + l > end) break;
        const body = b.slice(i, i + l); i += l;
        let d;
        if (c === 0xF0) { d = new Uint8Array(l + 1); d[0] = 0xF0; d.set(body, 1); } else d = body;   // F7 は中身をそのまま
        raw.push({ tick: t, tr, ord: ord++, d }); continue;
      }
      if (c & 0x80) { rs = c; i++; }
      if (!rs) break;
      const nd = ((rs & 0xF0) === 0xC0 || (rs & 0xF0) === 0xD0) ? 1 : 2;
      if (i + nd > end) break;
      const d = nd === 1 ? Uint8Array.of(rs, b[i]) : Uint8Array.of(rs, b[i], b[i + 1]); i += nd;
      raw.push({ tick: t, tr, ord: ord++, d });
    }
    pos += 8 + len; tr++;
  }
  tempos.sort((x, y) => x[0] - y[0]);
  const segs = [[0, 0, 500000]];                       // [tick, 秒, μs/四分音符]
  for (const [tk, us] of tempos) {
    const l = segs[segs.length - 1];
    if (tk === l[0]) l[2] = us; else segs.push([tk, l[1] + (tk - l[0]) * l[2] / 1e6 / div, us]);
  }
  const sec = tk => {
    let lo = 0, hi = segs.length - 1;
    while (lo < hi) { const m = (lo + hi + 1) >> 1; if (segs[m][0] <= tk) lo = m; else hi = m - 1; }
    const s = segs[lo]; return s[1] + (tk - s[0]) * s[2] / 1e6 / div;
  };
  raw.sort((x, y) => x.tick - y.tick || x.tr - y.tr || x.ord - y.ord);
  const ev = raw.map(r => ({ t: sec(r.tick), d: r.d }));
  const chans = new Set();
  for (const e of ev) if ((e.d[0] & 0xF0) === 0x90 && e.d[2] > 0) chans.add(e.d[0] & 15);
  return { ev, dur: ev.length ? ev[ev.length - 1].t : 0, chans: [...chans].sort((a, c) => a - c) };
}
const isQualitySysEx = d => d[0] === 0xF0 && d.length >= 7 && d[1] === 0x7D && d[2] === 0x4B && d[3] === 0x53 && d[4] === 0x01;
const isGMReset = d => d[0] === 0xF0 && ((d[1] === 0x7E && d[3] === 0x09) || (d[1] === 0x41 && d[4] === 0x12) || (d[1] === 0x43 && d[3] === 0x4C));

// ---------------- MIDI 出力 ----------------
const dry = () => $("dry").checked;
function send(d, ts) {
  if (dry() || !out) return;
  if (d[0] < 0x80) return;                                            // 続きだけの F7 など（送れない形）は飛ばす
  if (d[0] === 0xF0 && (!sysexOK || d[d.length - 1] !== 0xF7)) return;
  try { out.send(d, ts); } catch (e) { log(`送れませんでした（${e.message}）`); lost(); }
}
// 鳴っている音を全部止める。少し先まで時刻指定で送ってある分は取り消す（clear）。ブラウザが取り消しに
// 対応していなければ、送ってある分が出きった直後にもう一度止める。次に送り始めてよい時刻を quietUntil に
let quietUntil = 0;
function allNotesOff() {
  let ts = performance.now(), cleared = false;
  if (out && typeof out.clear === "function") { try { out.clear(); cleared = true; } catch {} }
  if (!cleared) ts += LOOKAHEAD * 1000 + 20;
  for (let ch = 0; ch < 16; ++ch) {
    for (const m of [[0xB0 | ch, 64, 0], [0xB0 | ch, 123, 0], [0xB0 | ch, 120, 0]]) { send(m); if (!cleared) send(m, ts); }
  }
  quietUntil = ts + 10;
}
const quietTime = () => Math.max(performance.now(), quietUntil);   // 送り始めてよい時刻
const gmReset = ts => send([0xF0, 0x7E, 0x7F, 0x09, 0x01, 0xF7], ts);
function portList() { return access ? [...access.outputs.values()].filter(o => o.state === "connected") : []; }
function pickPort() {
  const ports = portList(), want = settings.port || "";
  if (want) return ports.find(p => p.name === want) || null;
  const named = ports.find(p => p.name.includes(DEFAULT_PORT));
  if (named) return named;
  const hw = ports.filter(p => !SOFT_PORTS.some(s => p.name.includes(s)));
  return hw.length === 1 ? hw[0] : null;
}
function refreshPortSelect() {
  const sel = $("selPort"), ports = portList();
  sel.innerHTML = "";
  const auto = document.createElement("option"); auto.value = ""; auto.textContent = `自動（${DEFAULT_PORT}）`; sel.appendChild(auto);
  const names = new Set(ports.map(p => p.name)); if (settings.port) names.add(settings.port);
  for (const n of names) { const o = document.createElement("option"); o.value = n; o.textContent = n + (ports.some(p => p.name === n) ? "" : "（見つからない）"); sel.appendChild(o); }
  sel.value = settings.port || "";
}
function updateDevPill() {
  const p = $("devPill");
  if (dry()) { p.textContent = "本体: 送らない（確認用）"; p.className = "pill"; return; }
  if (out) { p.textContent = `本体: ${out.name}`; p.className = "pill ok"; }
  else { p.textContent = access ? "本体: 見つかりません" : "本体: 未接続"; p.className = "pill ng"; }
}
async function initMIDI() {
  if (!navigator.requestMIDIAccess) { log("このブラウザは Web MIDI に対応していません（Chrome か Edge で開いてください）"); updateDevPill(); return; }
  try { access = await navigator.requestMIDIAccess({ sysex: true }); sysexOK = true; }
  catch {
    try { access = await navigator.requestMIDIAccess(); sysexOK = false; log("SysEx が許可されなかったので、音質モードの切り替えと GM リセットは送りません"); }
    catch (e) { log(`MIDI が使えません（${e.message}）`); updateDevPill(); return; }
  }
  access.onstatechange = () => { refreshPortSelect(); checkPort(); };
  refreshPortSelect(); checkPort(true);
}
let reconnectTimer = 0;
function checkPort(first) {
  const p = pickPort();
  if (out && (!p || p.id !== out.id || out.state !== "connected")) lost();
  if (!out && p) {
    if (first) { out = p; log(`出力: ${p.name}`); updateDevPill(); return; }
    if (reconnectTimer) return;
    reconnectTimer = setTimeout(() => {                                // 本体の起動を待ってから
      reconnectTimer = 0;
      const q = pickPort(); if (!q) return;
      out = q; log(`つなぎ直しました: ${q.name}`); updateDevPill(); hideBanner();
      if (state === "waiting") startSong(cur);
    }, 2000);
  }
  updateDevPill();
}
function lost() {
  if (!out) return;
  out = null; updateDevPill();
  log("本体が見つからない / 抜けた");
  if (state === "playing" || state === "gap") { state = "waiting"; resetVisual(true); showBanner("本体が見つかりません。USB を挿し直すと、この曲を頭から再生します"); updateButtons(); }
}
function showBanner(t) { const b = $("banner"); b.textContent = t; b.hidden = false; }
function hideBanner() { $("banner").hidden = true; }

// ---------------- 曲の一覧 ----------------
function parsePlaylist(text, files) {          // files: Map(相対パス NFC → ファイル)
  const list = []; let section = "";
  for (let line of text.replace(/^﻿/, "").split(/\r?\n/)) {
    const h = line.match(/^\s*#\s*-{2,}\s*(.+?)\s*-{2,}/);
    if (h) { section = h[1].split(/[：:]/)[0].trim(); continue; }
    line = line.replace(/#.*/, "").trim();
    if (!line) continue;
    const key = line.normalize("NFC");
    if (files.has(key)) list.push({ ...files.get(key), section });
    else log(`playlist.txt の曲が見つかりません: ${line}`);
  }
  return list;
}
async function loadFromFileList(fileList) {
  const all = [...fileList];
  const pl = all.filter(f => f.name.toLowerCase() === "playlist.txt").sort((a, c) => a.webkitRelativePath.length - c.webkitRelativePath.length)[0];
  const base = pl ? pl.webkitRelativePath.slice(0, -"playlist.txt".length) : (all[0] ? all[0].webkitRelativePath.split("/")[0] + "/" : "");
  const mids = all.filter(f => /\.mid$/i.test(f.name));
  const map = new Map();
  for (const f of mids) {
    const rel = (f.webkitRelativePath.startsWith(base) ? f.webkitRelativePath.slice(base.length) : f.webkitRelativePath).normalize("NFC");
    map.set(rel, { name: f.name.normalize("NFC").replace(/\.mid$/i, ""), rel, file: f });
  }
  let list;
  if (pl) { list = parsePlaylist(await pl.text(), map); log(`playlist.txt の順番で ${list.length} 曲`); }
  else { list = [...map.values()].sort((a, c) => a.rel.localeCompare(c.rel, "ja")).map(s => ({ ...s, section: "" })); log(`playlist.txt が無いので名前順で ${list.length} 曲`); }
  setSongs(list);
}
async function loadFromURL(folder) {           // 動作確認用（http で開いたとき）
  const base = folder.replace(/\/?$/, "/");
  const text = await (await fetch(base + "playlist.txt")).text();
  const map = new Map();
  for (let line of text.split(/\r?\n/)) {
    line = line.replace(/#.*/, "").trim(); if (!line) continue;
    const rel = line.normalize("NFC");
    map.set(rel, { name: rel.split("/").pop().replace(/\.mid$/i, ""), rel, url: base + rel.split("/").map(encodeURIComponent).join("/") });
  }
  setSongs(parsePlaylist(text, map));
}
async function readSong(s) {
  const buf = s.file ? await s.file.arrayBuffer() : await (await fetch(s.url)).arrayBuffer();
  return parseSMF(buf);
}
async function setSongs(list) {
  songs = list; cur = -1; stopAll("idle");
  for (const s of songs) { try { s.dur = (await readSong(s)).dur; } catch (e) { s.dur = 0; s.err = e.message; } }
  renderPlaylist();
  $("title").textContent = songs.length ? "▶ 再生 を押すと始まります" : "再生できる .mid がありません";
  updateButtons();
}
function renderPlaylist() {
  const ul = $("plist"); ul.innerHTML = ""; let last = null, total = 0;
  songs.forEach((s, i) => {
    if (s.section && s.section !== last) { const li = document.createElement("li"); li.className = "sec"; li.textContent = s.section; ul.appendChild(li); }
    last = s.section;
    const li = document.createElement("li"); li.className = "song" + (i === cur ? " cur" : "");
    li.innerHTML = `<span></span><span class="d"></span>`;
    li.firstChild.textContent = s.name + (s.err ? "（読めない）" : "");
    li.lastChild.textContent = s.dur ? fmt(s.dur) : "";
    li.onclick = () => startSong(i);
    ul.appendChild(li); total += s.dur || 0;
  });
  $("total").textContent = songs.length ? `${songs.length} 曲・1 周 約 ${Math.round((total + songs.length * gapSec()) / 60)} 分` : "";
}
const gapSec = () => Math.max(0, parseFloat($("gap").value) || 0);

// ---------------- 再生 ----------------
const songTime = () => state === "playing" ? (performance.now() - songStart) / 1000 : pausePos;
function lowerBound(t) { let lo = 0, hi = song.ev.length; while (lo < hi) { const m = (lo + hi) >> 1; if (song.ev[m].t < t) lo = m + 1; else hi = m; } return lo; }
// 今の位置までの音色・CC・ベンド・プレッシャー・SysEx の最後の状態を送り直す（音は送らない）
function chase(upto, ts) {
  const last = new Map(), order = [];
  for (let i = 0; i < upto; ++i) {
    const d = song.ev[i].d, ty = d[0] & 0xF0, ch = d[0] & 15;
    if (d[0] === 0xF0 || d[0] === 0xF7) order.push(i);
    else if (ty === 0xC0) last.set(`p${ch}`, i);
    else if (ty === 0xE0) last.set(`b${ch}`, i);
    else if (ty === 0xD0) last.set(`a${ch}`, i);
    else if (ty === 0xB0 && d[1] < 120) last.set(`c${ch}_${d[1]}`, i);
  }
  for (const i of last.values()) order.push(i);
  order.sort((a, c) => a - c);
  for (const i of order) send(song.ev[i].d, ts);
}
let loadToken = 0;
async function startSong(i) {
  if (!songs.length) return;
  i = ((i % songs.length) + songs.length) % songs.length;
  allNotesOff();
  cur = i; renderPlaylist();
  state = "loading";                                       // 読み込み中は曲間の「次へ」を重ねて呼ばない
  const s = songs[i], token = ++loadToken;
  let loaded;
  try { loaded = await readSong(s); }
  catch (e) { if (token !== loadToken) return; log(`読めません: ${s.name}（${e.message}）飛ばします`); song = null; state = "gap"; gapUntil = performance.now() + 500; return; }
  if (token !== loadToken) return;                         // 読み込み中に別の曲が選ばれた
  song = loaded;
  $("title").textContent = s.name; $("section").textContent = s.section || "";
  $("tDur").textContent = fmt(song.dur); $("seek").max = Math.max(1, song.dur); $("seek").disabled = false;
  buildChannels();
  if (!dry() && !out) { state = "waiting"; showBanner("本体が見つかりません。USB を挿すと、この曲を頭から再生します"); updateButtons(); return; }
  hideBanner();
  const t0 = quietTime();
  gmReset(t0);
  sendIdx = 0; visIdx = 0; resetVisual(false);
  songStart = t0 + 300;                                    // GM リセットのあと少し待つ
  state = "playing"; updateButtons(); keepAwake();
  log(`再生: ${s.name}`);
}
function pause() {
  if (state !== "playing") return;
  pausePos = Math.max(0, songTime()); state = "paused";
  allNotesOff(); sendIdx = lowerBound(pausePos); resetVisual(true);
  log(`一時停止: ${songs[cur].name}`); updateButtons();
}
function resume() {
  if (state !== "paused" && state !== "stopped") return;
  if (!dry() && !out) { log("本体が見つからないので再開できません"); return; }
  const t0 = quietTime();
  sendIdx = lowerBound(pausePos); chase(sendIdx, t0);
  songStart = t0 + 50 - pausePos * 1000;
  state = "playing"; updateButtons(); keepAwake();
  log(`再開: ${songs[cur].name}（${fmt(pausePos)}）`);
}
function seekTo(pos) {
  if (!song) return;
  const was = state;
  allNotesOff();
  pausePos = Math.max(0, Math.min(song.dur, pos));
  sendIdx = lowerBound(pausePos); resetVisual(true); rebuildVisualTo(pausePos);
  if (was === "playing") { const t0 = quietTime(); chase(sendIdx, t0); songStart = t0 + 50 - pausePos * 1000; }
  else if (was !== "paused") state = "paused";
  updateButtons();
}
function stopAll(to = "stopped") {
  allNotesOff();
  if (song && to === "stopped") { pausePos = 0; resetVisual(true); rebuildVisualTo(0); }
  state = to; updateButtons(); releaseAwake();
}
function next() { if (songs.length) startSong(cur + 1); }
function prev() { if (songs.length) startSong(cur - 1); }
function togglePlay() {
  if (!songs.length) return;
  if (state === "playing") pause();
  else if (state === "paused" || state === "stopped") { if (song) resume(); else startSong(Math.max(0, cur)); }
  else if (state === "idle") startSong(Math.max(0, cur));
}
// 一定間隔で呼ぶ: 少し先までのイベントを時刻指定で送る / 曲の終わり / 曲間
function tick() {
  const now = performance.now();
  if (state === "playing" && song) {
    const horizon = (now - songStart) / 1000 + LOOKAHEAD;
    while (sendIdx < song.ev.length && song.ev[sendIdx].t <= horizon) {
      const e = song.ev[sendIdx++];
      send(e.d, Math.max(now, songStart + e.t * 1000));
    }
    if (sendIdx >= song.ev.length && (now - songStart) / 1000 >= song.dur + 1.5) {   // 最後の音の残響を待ってから
      allNotesOff();
      if (cur + 1 >= songs.length && !$("repeat").checked) { log("最後まで再生しました"); stopAll("stopped"); return; }
      state = "gap"; gapUntil = now + gapSec() * 1000; resetVisual(true); updateButtons();
    }
  } else if (state === "gap" && now >= gapUntil) next();
}
let ticker;
try {
  const w = new Worker(URL.createObjectURL(new Blob(["setInterval(() => postMessage(0), 20)"], { type: "text/javascript" })));
  w.onmessage = tick; ticker = w;
} catch { ticker = setInterval(tick, 20); }   // Worker が使えなければ普通のタイマー

// ---------------- 表示（チャンネル） ----------------
let vis = [];                  // チャンネルごとの表示の状態
let quality = -1;
function blankChan() { return { prog: 0, progSet: false, vol: 100, expr: 127, bend: 0, range: 2, rpnM: 127, rpnL: 127, notes: new Map(), dirty: true }; }
function resetVisual(keepState) {
  if (!keepState || !vis.length) { vis = Array.from({ length: 16 }, blankChan); quality = -1; }
  for (const c of vis) { c.notes.clear(); c.dirty = true; }
  showQuality();
}
function applyVisual(d) {
  if (d[0] === 0xF0) {
    if (isQualitySysEx(d)) { quality = d[5] ? 1 : 0; showQuality(); }
    else if (isGMReset(d)) { vis = Array.from({ length: 16 }, blankChan); quality = 0; showQuality(); }
    return;
  }
  const ty = d[0] & 0xF0, c = vis[d[0] & 15];
  if (!c) return;
  if (ty === 0x90 && d[2] > 0) c.notes.set(d[1], d[2]);
  else if (ty === 0x80 || ty === 0x90) c.notes.delete(d[1]);
  else if (ty === 0xC0) { c.prog = d[1]; c.progSet = true; }
  else if (ty === 0xE0) c.bend = ((d[2] << 7) | d[1]) - 8192;
  else if (ty === 0xB0) {
    const n = d[1], v = d[2];
    if (n === 7) c.vol = v; else if (n === 11) c.expr = v;
    else if (n === 101) c.rpnM = v; else if (n === 100) c.rpnL = v;
    else if (n === 6 && c.rpnM === 0 && c.rpnL === 0) c.range = v;
    else if (n === 121) { c.expr = 127; c.bend = 0; }
    else if (n === 120 || n === 123) c.notes.clear();
  }
  c.dirty = true;
}
function rebuildVisualTo(t) {   // 位置 t までの音色・CC・ベンドを反映（音は鳴っていないので押さえている鍵盤は出さない）
  vis = Array.from({ length: 16 }, blankChan); quality = -1;
  let i = 0;
  for (; i < song.ev.length && song.ev[i].t < t; ++i) applyVisual(song.ev[i].d);
  for (const c of vis) c.notes.clear();
  visIdx = i; showQuality();
}
function showQuality() {
  const p = $("qPill");
  if (quality === 1) { p.textContent = "音質: 高音質"; p.className = "pill hq"; }
  else if (quality === 0) { p.textContent = "音質: 普通"; p.className = "pill"; }
  else { p.textContent = "音質: —"; p.className = "pill"; }
}
let rows = [];
function buildChannels() {
  const box = $("chans"); box.innerHTML = ""; rows = [];
  if (!song.chans.length) { box.innerHTML = `<div class="empty">この曲には音がありません</div>`; return; }
  for (const ch of song.chans) {
    const el = document.createElement("div"); el.className = "chan";
    el.innerHTML = `<div class="info"><div class="head"><span class="no">ch${ch + 1}</span><span class="sw"></span><span class="inst"></span></div>
      <div class="gm"></div><div class="meters"><span>音量</span><span class="vol"><i></i></span><span class="bend"></span></div></div><canvas></canvas>`;
    el.querySelector(".sw").style.background = CH_COLORS[ch];
    box.appendChild(el);
    rows.push({ ch, el, inst: el.querySelector(".inst"), gm: el.querySelector(".gm"), vol: el.querySelector(".vol i"), bend: el.querySelector(".bend"), cv: el.querySelector("canvas"), w: 0 });
  }
  fitChannels();
}
// チャンネルが多いときは、画面に収まるように行を詰める（GM 名・音量の行を隠して鍵盤を低く）
function fitChannels() {
  const box = $("chans"), n = rows.length; if (!n) return;
  const avail = document.querySelector("main").clientHeight - document.querySelector(".now").offsetHeight - 48;
  const per = avail / n - 6;                           // 1 行の高さ（行の間 6px）
  const compact = per < 60;
  box.classList.toggle("compact", compact);
  box.style.setProperty("--keyh", `${Math.max(18, Math.min(40, Math.floor(compact ? per - 6 : per - 18)))}px`);
  for (const c of vis) c.dirty = true;
}
// 88 鍵（A0〜C8）。範囲外の音は端に寄せて出す
const LO = 21, HI = 108;
const isBlack = n => [1, 3, 6, 8, 10].includes(n % 12);
function drawKeys(r, c) {
  const cv = r.cv, dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  if (!w) return;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  const g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
  const css = getComputedStyle(document.documentElement);
  const whiteC = css.getPropertyValue("--white-key").trim(), blackC = css.getPropertyValue("--black-key").trim(), lineC = css.getPropertyValue("--line").trim();
  const whites = []; for (let n = LO; n <= HI; ++n) if (!isBlack(n)) whites.push(n);
  const ww = w / whites.length, color = CH_COLORS[r.ch];
  const on = new Map(); for (const [n, v] of c.notes) on.set(Math.max(LO, Math.min(HI, n)), v);
  const lit = (n, x, y, kw, kh) => { const v = on.get(n); if (v === undefined) return false; g.globalAlpha = 0.45 + 0.55 * v / 127; g.fillStyle = color; g.fillRect(x, y, kw, kh); g.globalAlpha = 1; return true; };
  whites.forEach((n, k) => {
    const x = k * ww;
    g.fillStyle = whiteC; g.fillRect(x, 0, ww, h);
    lit(n, x, 0, ww, h);
    g.fillStyle = lineC; g.fillRect(x, 0, 1, h);
    if (n % 12 === 0 && ww > 6) { g.fillStyle = "#8a93a6"; g.font = "9px system-ui"; g.fillText(`C${n / 12 - 1}`, x + 2, h - 3); }
  });
  let k = 0;
  for (let n = LO; n <= HI; ++n) {
    if (!isBlack(n)) { ++k; continue; }
    const x = k * ww - ww * 0.32, bw = ww * 0.64, bh = h * 0.6;
    g.fillStyle = blackC; g.fillRect(x, 0, bw, bh);
    lit(n, x, 0, bw, bh);
  }
}
function drawChannels() {
  for (const r of rows) {
    const c = vis[r.ch]; if (!c) continue;
    const w = r.cv.clientWidth;
    if (!c.dirty && r.w === w) continue;
    c.dirty = false; r.w = w;
    if (r.ch === 9) { r.inst.textContent = "Drum Kit"; r.gm.textContent = "ドラム（ch10）"; }
    else if (!c.progSet) { r.inst.textContent = "（音色の指定前）"; r.gm.textContent = "まだ音色が送られていない"; }
    else { r.inst.textContent = INST[GM_MAP[c.prog & 127]]; r.gm.textContent = `GM ${c.prog + 1} ${GM_NAMES[c.prog & 127]}`; }
    r.inst.style.opacity = r.ch === 9 || c.progSet ? 1 : 0.5;
    r.vol.style.width = `${Math.round(c.vol * c.expr / 127 / 127 * 100)}%`;
    const semi = c.bend / 8192 * c.range;
    r.bend.textContent = Math.abs(semi) >= 0.05 ? `ベンド ${semi > 0 ? "+" : ""}${semi.toFixed(1)}` : "";
    drawKeys(r, c);
  }
}
let lastUi = 0;
function frame() {
  if (song && (state === "playing" || state === "paused" || state === "stopped")) {
    if (state === "playing") {
      const t = songTime();
      while (visIdx < song.ev.length && song.ev[visIdx].t <= t) applyVisual(song.ev[visIdx++].d);
    }
    drawChannels();
    const now = performance.now();
    if (now - lastUi > 100) {
      lastUi = now; const t = Math.min(song.dur, Math.max(0, songTime()));
      $("tCur").textContent = fmt(t);
      if (!seeking) $("seek").value = t;
    }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.addEventListener("resize", () => { fitChannels(); for (const c of vis) c.dirty = true; });

// ---------------- ボタン・キー ----------------
function updateButtons() {
  const has = songs.length > 0;
  $("btnPlay").disabled = !has; $("btnPrev").disabled = !has; $("btnNext").disabled = !has;
  $("btnRestart").disabled = !song; $("btnStop").disabled = !song || state === "stopped";
  $("btnPlay").textContent = state === "playing" ? "⏸ 一時停止" : (state === "paused" ? "▶ 再開" : "▶ 再生");
  if (state === "gap") $("section").textContent = `次の曲まで ${gapSec()} 秒`;
  else if (cur >= 0 && songs[cur]) $("section").textContent = songs[cur].section || "";
}
$("btnFolder").onclick = () => $("dirInput").click();
$("dirInput").onchange = e => { if (e.target.files.length) loadFromFileList(e.target.files); };
$("btnPlay").onclick = togglePlay;
$("btnNext").onclick = next;
$("btnPrev").onclick = prev;
$("btnRestart").onclick = () => startSong(cur);
$("btnStop").onclick = () => { stopAll("stopped"); log("停止"); };
$("btnFull").onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
$("seek").addEventListener("input", () => { seeking = true; $("tCur").textContent = fmt(+$("seek").value); });
$("seek").addEventListener("change", () => { seeking = false; seekTo(+$("seek").value); });
$("selPort").onchange = e => { settings.port = e.target.value; saveSettings(); if (out) { allNotesOff(); out = null; } checkPort(true); if (state === "waiting" && out) startSong(cur); };
$("gap").onchange = e => { settings.gap = e.target.value; saveSettings(); renderPlaylist(); };
$("repeat").onchange = e => { settings.repeat = e.target.checked; saveSettings(); };
$("dry").onchange = () => { updateDevPill(); if (!dry() && !access) initMIDI(); };
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" && e.target.type !== "range" && e.target.type !== "checkbox") return;
  if (e.target.tagName === "SELECT") return;
  const k = e.key;
  if (k === " ") { e.preventDefault(); togglePlay(); }
  else if (k === "n" || k === "ArrowRight") { e.preventDefault(); next(); }
  else if (k === "b" || k === "ArrowLeft") { e.preventDefault(); prev(); }
  else if (k === "r") startSong(cur);
  else if (k === "s") { stopAll("stopped"); log("停止"); }
  else if (k === "f") $("btnFull").click();
});
// 再生中は画面を消さない
async function keepAwake() { try { if (!wakeLock && navigator.wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.onrelease = () => { wakeLock = null; }; } } catch {} }
function releaseAwake() { if (wakeLock) { wakeLock.release(); wakeLock = null; } }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && state === "playing") keepAwake(); });

// ---------------- 起動 ----------------
if (settings.gap !== undefined) $("gap").value = settings.gap;
if (settings.repeat !== undefined) $("repeat").checked = settings.repeat;
if (params.get("dry") === "1") $("dry").checked = true;
refreshPortSelect(); updateDevPill(); updateButtons();
if (!dry()) initMIDI();
if (params.get("load")) loadFromURL(params.get("load")).catch(e => log(`読めません: ${e.message}`));
log("起動しました。「フォルダを選ぶ」で「最適化後」フォルダを選んでください");
</script>
</body>
</html>
